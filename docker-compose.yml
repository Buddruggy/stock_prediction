services:
  # 后端服务 (Python / FastAPI)
  backend:
    build:
      context: .
      dockerfile: deployment/backend/Dockerfile
    container_name: zhitou-prediction-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DB_PATH=/app/data/predictions.db
      - ENVIRONMENT=production
      - TZ=Asia/Shanghai
      # DeepSeek key 从宿主机 .env 注入（仅用于自然语言解读，非价格预测）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - backend_data:/app/data
      - ./logs:/app/logs
    networks:
      - zhitou-network

  # 前端服务 (Vue + Nginx)
  frontend:
    build:
      context: .
      dockerfile: deployment/frontend/Dockerfile
    container_name: zhitou-prediction-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "9000:9000"
      - "443:443"
    depends_on:
      - backend
    networks:
      - zhitou-network

networks:
  zhitou-network:
    driver: bridge

volumes:
  backend_data:
    driver: local
